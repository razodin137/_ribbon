<!doctype html>
<html lang="en" data-ribbon-shell>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ribbon-shell" content="1">
<title>Apps</title>
<script>
  try {
    if (sessionStorage.getItem("ribbon:shell-hidden") === "1") {
      document.documentElement.classList.add("is-hidden");
    }
  } catch (error) {}
</script>
<style>
  :root {
    --bar-h: 40px;
    --ink: #eee9dc;
    --muted: #979284;
    --line: rgba(255, 255, 255, .13);
    --accent: #d0a64a;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    overflow: hidden;
    background: #101210;
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
  }

  .bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    height: var(--bar-h);
    margin: 0;
    padding: 0 7px 0 13px;
    background: rgba(17, 18, 15, .97);
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(0, 0, 0, .35);
    user-select: none;
    -webkit-user-select: none;
    transform: translateY(0);
    transition: transform 260ms cubic-bezier(.2, .7, .2, 1), opacity 180ms ease;
    will-change: transform;
  }

  html.is-hidden .bar {
    transform: translateY(calc(-100% - 1px));
    opacity: 0;
    pointer-events: none;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
  }

  .led-wrap {
    position: relative;
    display: flex;
    align-items: center;
    flex: none;
  }

  .leds {
    appearance: none;
    -webkit-appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 28px;
    margin: 0 0 0 -7px;
    padding: 0 7px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    font: inherit;
    touch-action: manipulation;
  }

  .leds:hover { background: rgba(255, 255, 255, .06); }
  .leds:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #454741;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    transition: background .2s ease, box-shadow .2s ease;
    flex: none;
  }

  .led.ok {
    background: #65d18a;
    box-shadow: 0 0 0 3px rgba(101, 209, 138, .1), 0 0 8px rgba(101, 209, 138, .45);
  }

  .led.warn {
    background: #e0b35a;
    box-shadow: 0 0 0 3px rgba(224, 179, 90, .1), 0 0 8px rgba(224, 179, 90, .4);
  }

  .led.bad {
    background: #e0675a;
    box-shadow: 0 0 0 3px rgba(224, 103, 90, .1), 0 0 8px rgba(224, 103, 90, .45);
  }

  .led.off { background: #454741; box-shadow: none; }

  .led-tip {
    position: absolute;
    top: calc(100% + 8px);
    left: -2px;
    z-index: 30;
    width: max-content;
    max-width: min(320px, calc(100vw - 24px));
    padding: 9px 11px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 8px;
    background: #1b1d18;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .4);
    color: #e9e4d6;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: 0;
    text-transform: none;
    white-space: normal;
    opacity: 0;
    transform: translateY(-4px) scale(.98);
    transform-origin: top left;
    transition: opacity .15s ease, transform .18s cubic-bezier(.2, .7, .2, 1);
    pointer-events: none;
  }

  .led-tip.is-open {
    opacity: 1;
    transform: none;
  }

  .led-tip::before {
    content: "";
    position: absolute;
    top: -5px;
    left: 15px;
    width: 8px;
    height: 8px;
    background: #1b1d18;
    border-top: 1px solid rgba(255, 255, 255, .14);
    border-left: 1px solid rgba(255, 255, 255, .14);
    transform: rotate(45deg);
  }

  .led-tip-row {
    display: flex;
    align-items: flex-start;
    gap: 7px;
  }

  .led-tip-row + .led-tip-row { margin-top: 5px; }
  .led-tip-row .led { margin-top: 3px; }
  .led-tip-row span:last-child { display: block; }

  .count {
    color: #cfc9b9;
    min-width: 52px;
  }

  .title-wrap {
    display: flex;
    align-items: center;
    flex: 1 1 auto;
    min-width: 0;
  }

  .title {
    appearance: none;
    -webkit-appearance: none;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1 1 auto;
    min-width: 0;
    height: 28px;
    margin: 0;
    padding: 0 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #f4f0e6;
    font: inherit;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .005em;
    text-align: left;
    cursor: pointer;
  }

  .title:hover { background: rgba(255, 255, 255, .075); }
  .title:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }

  .title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .title .chev {
    width: 13px;
    height: 13px;
    flex: none;
    color: var(--muted);
    transition: transform .15s ease;
  }

  .title[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .menu {
    position: absolute;
    top: calc(100% - 4px);
    left: 8px;
    z-index: 40;
    display: flex;
    flex-direction: column;
    width: min(430px, calc(100vw - 16px));
    max-height: min(70vh, 560px);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px;
    background: #1b1d18;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .48);
    color: #e9e4d6;
    user-select: text;
    -webkit-user-select: text;
  }

  .menu[hidden] { display: none; }

  .menu-top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 8px;
  }

  .menu-current {
    flex: 1 1 auto;
    min-width: 0;
  }

  .menu-current-label {
    display: block;
    margin-bottom: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .menu-current-title {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
    color: #f4f0e6;
  }

  .star-btn {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin: 0;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex: none;
  }

  .star-btn:hover { background: rgba(255, 255, 255, .07); color: #f1d18a; }
  .star-btn[aria-pressed="true"] {
    border-color: rgba(241, 209, 138, .4);
    background: rgba(241, 209, 138, .08);
    color: #f1d18a;
  }
  .star-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .star-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }

  .menu-search { padding: 0 12px 9px; }

  .menu-input {
    width: 100%;
    height: 30px;
    padding: 0 10px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 6px;
    background: #12130f;
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    outline: none;
  }

  .menu-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(208, 166, 74, .18);
  }

  .menu-input::placeholder { color: #7c786c; }

  .menu-scroll {
    overflow-y: auto;
    padding: 0 6px 8px;
    overscroll-behavior: contain;
    scrollbar-width: thin;
  }

  .menu-heading {
    padding: 8px 8px 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .menu-section[hidden] { display: none; }

  .menu-section + .menu-section .menu-heading {
    margin-top: 4px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, .08);
  }

  .menu-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: 6px;
  }

  .menu-row:hover { background: rgba(255, 255, 255, .055); }
  .menu-row.is-current { background: rgba(208, 166, 74, .1); }

  .menu-app {
    appearance: none;
    -webkit-appearance: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    flex: 1 1 auto;
    min-width: 0;
    margin: 0;
    padding: 6px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #e9e4d6;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .menu-app:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .menu-app-title {
    display: block;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12.5px;
  }

  .menu-row.is-current .menu-app-title { color: #f6e5b4; }

  .menu-app-dir {
    display: block;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 9.5px;
    color: #7f7b6e;
  }

  .row-star {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    margin: 0 2px 0 0;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #6f6b60;
    font: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    flex: none;
  }

  .row-star:hover { background: rgba(255, 255, 255, .08); color: #f1d18a; }
  .row-star[aria-pressed="true"] { color: #f1d18a; }
  .row-star:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }

  .menu-empty {
    padding: 18px 12px;
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }

  .menu-empty[hidden] { display: none; }

  .actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
  }

  .btn {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    margin: 0;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: #cfc9b8;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn:hover { background: rgba(255, 255, 255, .075); color: #fff; }
  .btn:active { background: rgba(255, 255, 255, .11); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  .btn:disabled { opacity: .28; cursor: default; pointer-events: none; }
  .btn svg { width: 15px; height: 15px; flex: none; }

  .sep {
    width: 1px;
    height: 17px;
    margin: 0 4px;
    background: rgba(255, 255, 255, .13);
  }

  #app {
    position: fixed;
    top: var(--bar-h);
    left: 0;
    display: block;
    width: 100%;
    height: calc(100vh - var(--bar-h));
    height: calc(100dvh - var(--bar-h));
    border: 0;
    background: #f7f3ea;
  }

  #app[hidden] { display: none; }

  html.is-hidden #app {
    top: 0;
    height: 100vh;
    height: 100dvh;
  }

  html.is-hidden .empty {
    inset: 0 0 0 0;
  }

  .peek {
    position: fixed;
    top: 0;
    right: 14px;
    z-index: 11;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 19px;
    margin: 0;
    padding: 0 8px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-top: 0;
    border-radius: 0 0 6px 6px;
    background: rgba(17, 18, 15, .85);
    color: #b9b3a4;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .peek.is-shown {
    opacity: .42;
    transform: none;
    pointer-events: auto;
  }

  .peek.is-shown:hover,
  .peek.is-shown:focus-visible { opacity: 1; }
  .peek:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .empty {
    position: fixed;
    inset: var(--bar-h) 0 0 0;
    display: grid;
    place-items: center;
    padding: 32px;
    background: #f7f3ea;
    color: #23251f;
  }

  .empty[hidden] { display: none; }

  .empty-inner {
    width: min(100%, 520px);
  }

  .empty h1 {
    margin: 0 0 14px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .empty p {
    margin: 0 0 12px;
    font-size: 15px;
    line-height: 1.55;
    color: #5f6157;
  }

  .empty code {
    display: block;
    padding: 12px 14px;
    border: 1px solid #ded6c6;
    border-radius: 8px;
    background: #fffdf8;
    color: #23251f;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
    overflow-x: auto;
  }

  @media (max-width: 720px) {
    .bar { gap: 8px; padding: 0 4px 0 10px; }
    .label { display: none; }
    .btn { padding: 0 8px; }
    .count { min-width: 0; }
    .title { font-size: 12.5px; padding: 0 4px; }
    .menu {
      left: 4px;
      width: calc(100vw - 8px);
      max-height: calc(100vh - 56px);
    }
  }

  @media (max-width: 420px) {
    .leds { gap: 4px; padding: 0 5px; margin-left: -5px; }
    .count { font-size: 9px; }
    .peek-label { display: none; }
    .menu-app-dir { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar, .peek, .led-tip { transition: none; }
  }
</style>
</head>
<body>
  <div class="bar" id="bar" role="navigation" aria-label="App ribbon">
    <div class="meta">
      <span class="led-wrap">
        <button class="leds" id="leds" type="button" aria-label="Git status" aria-expanded="false" aria-describedby="led-tip">
          <span class="led off" id="led-repo" aria-hidden="true"></span>
          <span class="led off" id="led-sync" aria-hidden="true"></span>
        </button>
        <span class="led-tip" id="led-tip" role="tooltip" aria-hidden="true">
          <span class="led-tip-row"><span class="led off" data-tip-led="repo" aria-hidden="true"></span><span data-tip-text="repo"></span></span>
          <span class="led-tip-row"><span class="led off" data-tip-led="sync" aria-hidden="true"></span><span data-tip-text="sync"></span></span>
        </span>
      </span>
      <span class="count" id="count"></span>
    </div>
    <div class="title-wrap">
      <button class="title" id="title" type="button" aria-haspopup="dialog" aria-expanded="false" title="Show all apps">
        <span class="title-text" id="title-text"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="actions">
      <button class="btn" type="button" data-act="prev" aria-label="Previous app" title="Previous app — [">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span class="label">Back</span>
      </button>
      <button class="btn" type="button" data-act="next" aria-label="Next app" title="Next app — ]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        <span class="label">Next</span>
      </button>
      <button class="btn" type="button" data-act="random" aria-label="Random app" title="Random app — R">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 4l3 3-3 3"/><path d="M18 20l3-3-3-3"/><path d="M3 7h3c2 0 3.5 1 4.5 2.5l3 5C14.5 16 16 17 18 17h3"/><path d="M3 17h3c2 0 3.5-1 4.5-2.5l3-5C14.5 8 16 7 18 7h3"/></svg>
        <span class="label">Random</span>
      </button>
      <button class="btn" type="button" data-act="reload" aria-label="Reload app" title="Reload app — Shift+R">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" type="button" data-act="hide" aria-label="Hide ribbon" title="Hide ribbon — H">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="menu" id="menu" hidden role="dialog" aria-label="All apps">
      <div class="menu-top">
        <div class="menu-current">
          <span class="menu-current-label">Current app</span>
          <span class="menu-current-title" id="menu-current-title"></span>
        </div>
        <button class="star-btn" id="star-current" type="button" aria-pressed="false" aria-label="Add to favorites" title="Add to favorites">☆</button>
      </div>
      <div class="menu-search">
        <input class="menu-input" id="menu-input" type="search" placeholder="Search apps…" aria-label="Search apps" autocomplete="off" spellcheck="false">
      </div>
      <div class="menu-scroll">
        <div class="menu-section" data-section="favorites" hidden>
          <div class="menu-heading">Favorites</div>
          <div class="menu-list" data-list="favorites"></div>
        </div>
        <div class="menu-section" data-section="all">
          <div class="menu-heading">All apps</div>
          <div class="menu-list" data-list="all"></div>
        </div>
        <div class="menu-empty" hidden>No apps match.</div>
      </div>
    </div>
  </div>

  <button class="peek" id="peek" type="button" aria-label="Show ribbon" title="Show ribbon — H">
    <span aria-hidden="true">▤</span><span class="peek-label">ribbon</span>
  </button>

  <iframe id="app" title="App" loading="eager"></iframe>

  <div class="empty" id="empty" hidden>
    <div class="empty-inner">
      <h1>No apps listed yet</h1>
      <p>Add a folder containing an <code style="display:inline;padding:2px 5px">index.html</code>, then regenerate the list:</p>
      <code>python3 _ribbon/ribbon.py --write-apps</code>
      <p style="margin-top:14px">Or add an entry to <code style="display:inline;padding:2px 5px">apps.js</code> by hand.</p>
    </div>
  </div>

  <script src="apps.js"></script>
  <script>
  (function () {
    "use strict";

    var apps = (Array.isArray(window.__RIBBON_APPS__) ? window.__RIBBON_APPS__ : []).filter(function (app) {
      return app && typeof app.url === "string" && app.url;
    });

    var bar = document.getElementById("bar");
    var countEl = document.getElementById("count");
    var titleButton = document.getElementById("title");
    var titleText = document.getElementById("title-text");
    var frame = document.getElementById("app");
    var empty = document.getElementById("empty");
    var peek = document.getElementById("peek");
    var ledsButton = document.getElementById("leds");
    var ledWrap = ledsButton.parentNode;
    var ledTip = document.getElementById("led-tip");
    var tipRepoDot = ledTip.querySelector('[data-tip-led="repo"]');
    var tipSyncDot = ledTip.querySelector('[data-tip-led="sync"]');
    var tipRepoText = ledTip.querySelector('[data-tip-text="repo"]');
    var tipSyncText = ledTip.querySelector('[data-tip-text="sync"]');
    var ledRepo = document.getElementById("led-repo");
    var ledSync = document.getElementById("led-sync");
    var buttons = document.querySelectorAll("button[data-act]");

    var menuEl = document.getElementById("menu");
    var menuCurrentTitle = document.getElementById("menu-current-title");
    var starCurrent = document.getElementById("star-current");
    var searchInput = document.getElementById("menu-input");
    var menuFavSection = menuEl.querySelector('[data-section="favorites"]');
    var menuAllSection = menuEl.querySelector('[data-section="all"]');
    var menuFavList = menuEl.querySelector('[data-list="favorites"]');
    var menuAllList = menuEl.querySelector('[data-list="all"]');
    var menuAllHeading = menuAllSection.querySelector(".menu-heading");
    var menuEmpty = menuEl.querySelector(".menu-empty");

    var STORAGE_KEY = "ribbon:shell-hidden";
    var index = -1;
    var manualHidden = readHidden();
    var autoHidden = false;
    var suppressScrollUntil = 0;
    var lastTargets = new Map();
    var wiredDocs = new WeakSet();
    var tipPinned = false;
    var tipTimer = 0;
    var hoverCapable = window.matchMedia("(hover: hover)").matches;
    var favorites = readFavorites();
    var menuOpen = false;

    frame.addEventListener("load", wireFrame);

    if (!apps.length) {
      empty.hidden = false;
      frame.hidden = true;
      titleText.textContent = "No apps listed";
      titleButton.title = "Show all apps";
      menuCurrentTitle.textContent = "No apps listed";
      countEl.textContent = "00 / 00";
      disablePaging();
      setGit(null);
      updateCurrentStar();
      applyHidden();
    } else {
      var start = 0;
      var hash = readHash();
      if (hash) {
        for (var i = 0; i < apps.length; i += 1) {
          if (apps[i].url === hash) {
            start = i;
            break;
          }
        }
      }
      setApp(start);
    }

    window.addEventListener("keydown", onKey, true);
    window.addEventListener("hashchange", function () {
      var wanted = readHash();
      if (!wanted) return;
      for (var i = 0; i < apps.length; i += 1) {
        if (apps[i].url === wanted && i !== index) {
          setApp(i, false);
          break;
        }
      }
    });

    bar.addEventListener("click", function (event) {
      var button = event.target && event.target.closest
        ? event.target.closest("button[data-act]")
        : null;
      if (!button) return;
      var action = button.getAttribute("data-act");
      if (action === "prev") step(-1);
      else if (action === "next") step(1);
      else if (action === "random") random();
      else if (action === "reload") reloadApp();
      else if (action === "hide") setManual(true);
    });

    peek.addEventListener("click", function () {
      setManual(false);
    });

    titleButton.addEventListener("click", toggleMenu);
    starCurrent.addEventListener("click", function () {
      var app = currentApp();
      if (app) toggleFavorite(app, false);
      starCurrent.focus();
    });
    searchInput.addEventListener("input", function () {
      renderMenu(searchInput.value);
    });
    searchInput.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        event.preventDefault();
        closeMenu(true);
        return;
      }
      if (event.key === "Enter") {
        var first = menuEl.querySelector(".menu-app");
        if (first) {
          event.preventDefault();
          setApp(Number(first.getAttribute("data-app")));
        }
        return;
      }
      if (event.key === "ArrowDown") {
        var first = menuEl.querySelector(".menu-app");
        if (first) {
          event.preventDefault();
          first.focus();
        }
      }
    });
    menuEl.addEventListener("click", function (event) {
      var star = event.target && event.target.closest
        ? event.target.closest(".row-star")
        : null;
      if (star) {
        for (var i = 0; i < apps.length; i += 1) {
          if (appKey(apps[i]) === star.getAttribute("data-star")) {
            toggleFavorite(apps[i], true);
            break;
          }
        }
        return;
      }

      var row = event.target && event.target.closest
        ? event.target.closest(".menu-app")
        : null;
      if (row) setApp(Number(row.getAttribute("data-app")));
    });
    document.addEventListener("pointerdown", function (event) {
      if (!menuOpen) return;
      if (bar.contains(event.target)) return;
      closeMenu(false);
    }, true);

    ledsButton.addEventListener("click", function (event) {
      event.stopPropagation();
      toggleTip();
    });
    ledsButton.addEventListener("pointerenter", function () {
      if (hoverCapable) openTip(false);
    });
    ledsButton.addEventListener("pointerleave", closeTipIfUnpinned);
    ledsButton.addEventListener("focus", function () {
      openTip(false);
    });
    ledsButton.addEventListener("blur", closeTipIfUnpinned);
    document.addEventListener("pointerdown", function (event) {
      if (!ledTip.classList.contains("is-open")) return;
      if (ledWrap.contains(event.target)) return;
      closeTip();
    }, true);

    function setApp(next, updateHash) {
      if (!apps.length) return;
      closeTip();
      closeMenu(false);
      index = (next + apps.length) % apps.length;
      var app = apps[index];

      titleText.textContent = app.title || "Untitled";
      titleButton.title = "Show all apps";
      menuCurrentTitle.textContent = app.title || "Untitled";
      countEl.textContent = pad(index + 1) + " / " + pad(apps.length);
      document.title = (app.title ? app.title + " — " : "") + "Apps";
      frame.title = app.title || "App";
      frame.src = app.url;
      setGit(app.git);
      refreshGit(app);
      updateCurrentStar();

      if (apps.length < 2) disablePaging();

      if (updateHash !== false) {
        var nextHash = "#" + encodeURIComponent(app.url);
        try {
          history.replaceState(null, "", nextHash);
        } catch (error) {
          location.hash = encodeURIComponent(app.url);
        }
      }

      lastTargets.clear();
      suppressScrollUntil = Date.now() + 300;
    }

    function setGit(git) {
      var repo = !!(git && git.repo);
      var state = (git && git.state) || "";
      var repoClass = repo ? "ok" : "off";
      var syncClass = "off";
      if (repo) {
        if (state === "ahead") syncClass = "bad";
        else if (state === "dirty" || state === "no-upstream" || state === "detached" || state === "no-commits") syncClass = "warn";
        else if (state === "error") syncClass = "off";
        else syncClass = "ok";
      }

      ledRepo.className = "led " + repoClass;
      ledSync.className = "led " + syncClass;
      tipRepoDot.className = "led " + repoClass;
      tipSyncDot.className = "led " + syncClass;

      var repoText = repoTip(git);
      var syncText = gitTip(git);
      tipRepoText.textContent = repoText;
      tipSyncText.textContent = syncText;
      ledsButton.setAttribute("aria-label", repoText + ". " + syncText);
    }

    function repoTip(git) {
      if (!git || !git.repo) {
        return git && git.state === "error"
          ? "Git status unavailable"
          : "Not a Git repository";
      }
      return "Git repository" + (git.branch ? " — " + git.branch : "");
    }

    function gitTip(git) {
      if (!git || !git.repo) return "No push status";
      var bits = [];
      if (git.state === "ahead") {
        var count = git.ahead || 1;
        bits.push(count + " commit" + (count === 1 ? "" : "s") + " not pushed");
      } else if (git.state === "no-upstream") {
        bits.push("No upstream branch");
      } else if (git.state === "detached") {
        bits.push("Detached HEAD");
      } else if (git.state === "no-commits") {
        bits.push("No commits yet");
      } else if (git.state === "dirty") {
        bits.push("Uncommitted changes");
      } else if (git.state === "error") {
        bits.push("Git status unavailable");
      } else {
        bits.push("All changes pushed");
      }
      if (git.dirty && git.state !== "dirty") bits.push("uncommitted changes");
      if (git.behind) bits.push(git.behind + " behind");
      return bits.join(" · ");
    }

    function openTip(pin) {
      if (pin) tipPinned = true;
      ledTip.classList.add("is-open");
      ledTip.setAttribute("aria-hidden", "false");
      ledsButton.setAttribute("aria-expanded", "true");
      if (tipTimer) {
        clearTimeout(tipTimer);
        tipTimer = 0;
      }
      if (!hoverCapable && tipPinned) {
        tipTimer = setTimeout(closeTip, 5000);
      }
    }

    function closeTip() {
      tipPinned = false;
      ledTip.classList.remove("is-open");
      ledTip.setAttribute("aria-hidden", "true");
      ledsButton.setAttribute("aria-expanded", "false");
      if (tipTimer) {
        clearTimeout(tipTimer);
        tipTimer = 0;
      }
    }

    function toggleTip() {
      if (ledTip.classList.contains("is-open") && tipPinned) closeTip();
      else openTip(true);
    }

    function closeTipIfUnpinned() {
      if (!tipPinned) closeTip();
    }

    function refreshGit(app) {
      if (!app || !app.dir) return;
      if (location.protocol !== "http:" && location.protocol !== "https:") return;
      fetch("/__ribbon/git.json?dir=" + encodeURIComponent(app.dir), {
        cache: "no-store"
      })
        .then(function (response) {
          return response.ok ? response.json() : null;
        })
        .then(function (data) {
          if (!data || app !== apps[index]) return;
          app.git = data;
          setGit(data);
        })
        .catch(function () {});
    }

    function step(direction) {
      if (apps.length < 2) return;
      setApp(index + direction);
    }

    function random() {
      if (apps.length < 2) return;
      var pick = Math.floor(Math.random() * (apps.length - 1));
      if (pick >= index) pick += 1;
      setApp(pick);
    }

    function reloadApp() {
      closeMenu(false);
      if (!apps.length) return;
      try {
        frame.contentWindow.location.reload();
      } catch (error) {
        frame.src = apps[index].url;
      }
    }

    function appKey(app) {
      return app ? app.dir || app.url || "" : "";
    }

    function readFavorites() {
      try {
        var stored = JSON.parse(localStorage.getItem("ribbon:favorites") || "[]");
        if (Array.isArray(stored)) {
          return new Set(stored.filter(function (item) {
            return typeof item === "string";
          }));
        }
      } catch (error) {}
      return new Set();
    }

    function saveFavorites() {
      try {
        localStorage.setItem("ribbon:favorites", JSON.stringify(Array.from(favorites)));
      } catch (error) {}
    }

    function isFavorite(app) {
      return !!app && favorites.has(appKey(app));
    }

    function currentApp() {
      return index >= 0 ? apps[index] : null;
    }

    function updateCurrentStar() {
      var app = currentApp();
      var favorite = isFavorite(app);
      var name = app ? app.title || "this app" : "this app";
      var label = (favorite ? "Remove " : "Add ") +
        name + (favorite ? " from favorites" : " to favorites");
      starCurrent.disabled = !app;
      starCurrent.setAttribute("aria-pressed", favorite ? "true" : "false");
      starCurrent.textContent = favorite ? "★" : "☆";
      starCurrent.title = label;
      starCurrent.setAttribute("aria-label", label);
    }

    function favoriteRow(app, appIndex) {
      var favorite = isFavorite(app);
      var row = document.createElement("div");
      row.className = "menu-row" + (appIndex === index ? " is-current" : "");

      var open = document.createElement("button");
      open.type = "button";
      open.className = "menu-app";
      open.setAttribute("data-app", String(appIndex));
      if (appIndex === index) open.setAttribute("aria-current", "true");

      var title = document.createElement("span");
      title.className = "menu-app-title";
      title.textContent = app.title || "Untitled";

      var dir = document.createElement("span");
      dir.className = "menu-app-dir";
      dir.textContent = "/" + (app.dir || "");

      open.appendChild(title);
      open.appendChild(dir);

      var star = document.createElement("button");
      star.type = "button";
      star.className = "row-star";
      star.setAttribute("data-star", appKey(app));
      star.setAttribute("aria-pressed", favorite ? "true" : "false");
      star.title = favorite ? "Remove from favorites" : "Add to favorites";
      star.setAttribute(
        "aria-label",
        (favorite ? "Remove " : "Add ") +
          (app.title || "app") +
          (favorite ? " from favorites" : " to favorites")
      );
      star.textContent = favorite ? "★" : "☆";

      row.appendChild(open);
      row.appendChild(star);
      return row;
    }

    function matchesQuery(app, query) {
      if (!query) return true;
      var haystack = String(app.title || "").toLowerCase() +
        " " + String(app.dir || "").toLowerCase();
      return haystack.indexOf(query) !== -1;
    }

    function renderMenu(query) {
      var needle = (query || "").trim().toLowerCase();
      menuFavList.textContent = "";
      menuAllList.textContent = "";
      var favoriteCount = 0;
      var otherCount = 0;

      apps.forEach(function (app, appIndex) {
        if (!matchesQuery(app, needle)) return;
        if (isFavorite(app)) {
          menuFavList.appendChild(favoriteRow(app, appIndex));
          favoriteCount += 1;
        } else {
          menuAllList.appendChild(favoriteRow(app, appIndex));
          otherCount += 1;
        }
      });

      menuFavSection.hidden = favoriteCount === 0;
      menuAllSection.hidden = otherCount === 0;
      menuEmpty.hidden = favoriteCount + otherCount > 0;
      menuAllHeading.textContent = favoriteCount ? "Other apps" : "All apps";
    }

    function openMenu() {
      if (!apps.length) return;
      if (menuOpen) {
        searchInput.focus();
        searchInput.select();
        return;
      }
      menuOpen = true;
      menuEl.hidden = false;
      titleButton.setAttribute("aria-expanded", "true");
      searchInput.value = "";
      renderMenu("");
      updateCurrentStar();
      requestAnimationFrame(function () {
        searchInput.focus();
        searchInput.select();
      });
    }

    function closeMenu(returnFocus) {
      if (!menuOpen) return;
      menuOpen = false;
      menuEl.hidden = true;
      titleButton.setAttribute("aria-expanded", "false");
      if (returnFocus) titleButton.focus();
    }

    function toggleMenu() {
      if (menuOpen) closeMenu(true);
      else openMenu();
    }

    function toggleFavorite(app, focusStar) {
      var key = appKey(app);
      if (!key) return;
      if (favorites.has(key)) favorites.delete(key);
      else favorites.add(key);
      saveFavorites();
      renderMenu(searchInput.value);
      updateCurrentStar();
      if (focusStar) {
        var stars = menuEl.querySelectorAll("[data-star]");
        for (var i = 0; i < stars.length; i += 1) {
          if (stars[i].getAttribute("data-star") === key) {
            stars[i].focus();
            break;
          }
        }
      }
    }

    function disablePaging() {
      for (var i = 0; i < buttons.length; i += 1) {
        var action = buttons[i].getAttribute("data-act");
        if (action !== "hide") buttons[i].disabled = true;
      }
    }

    function pad(number) {
      var width = String(apps.length).length;
      var value = String(number);
      while (value.length < width) value = "0" + value;
      return value;
    }

    function wireFrame() {
      var win;
      var doc;
      try {
        win = frame.contentWindow;
        doc = frame.contentDocument;
      } catch (error) {
        return;
      }
      if (!win || !doc || wiredDocs.has(doc)) return;
      wiredDocs.add(doc);

      try {
        win.addEventListener("scroll", onScroll, { passive: true });
        doc.addEventListener("scroll", onScroll, { passive: true, capture: true });
        doc.addEventListener("pointerdown", closeTip, true);
        doc.addEventListener("pointerdown", function () {
          closeMenu(false);
        }, true);
        win.addEventListener("focus", function () {
          closeMenu(false);
        });
        win.addEventListener("keydown", onKey, true);
      } catch (error) {
        return;
      }
    }

    var pendingScroll = null;

    function onScroll(event) {
      if (pendingScroll) return;
      pendingScroll = event;
      requestAnimationFrame(processScroll);
    }

    function processScroll() {
      var event = pendingScroll;
      pendingScroll = null;
      if (manualHidden || Date.now() < suppressScrollUntil) return;
      if (event && event.target && menuEl.contains(event.target)) return;

      var win;
      var doc;
      try {
        win = frame.contentWindow;
        doc = frame.contentDocument;
      } catch (error) {
        return;
      }
      if (!win || !doc) return;

      var target = event && event.target;
      if (
        target === win ||
        target === doc ||
        target === doc.documentElement ||
        target === doc.body
      ) {
        target = null;
      }

      var y = target
        ? target.scrollTop
        : (win.scrollY || win.pageYOffset || doc.documentElement.scrollTop || 0);
      var hasPrevious = lastTargets.has(target);
      var previous = hasPrevious ? lastTargets.get(target) : y;
      var delta = y - previous;

      if (Math.abs(delta) < 10) {
        if (!hasPrevious) lastTargets.set(target, y);
        return;
      }

      var nextHidden;
      if (y <= 8) nextHidden = false;
      else if (delta > 0 && y > 48) nextHidden = true;
      else if (delta < 0) nextHidden = false;
      else return;

      lastTargets.set(target, y);
      if (nextHidden !== autoHidden) {
        autoHidden = nextHidden;
        applyHidden();
      }
    }

    function onKey(event) {
      if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
      var target = event.target;
      if (
        target &&
        (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))
      ) {
        return;
      }

      var key = event.key;
      if (key === "Escape" && menuOpen) {
        closeMenu(true);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "/") {
        openMenu();
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (menuOpen) return;
      if (key === "Escape" && ledTip.classList.contains("is-open")) {
        closeTip();
        event.preventDefault();
        event.stopPropagation();
        return;
      }

      var handled = true;
      if (key === "[") step(-1);
      else if (key === "]") step(1);
      else if (key === "r" || key === "R") {
        if (event.shiftKey) reloadApp();
        else random();
      } else if (key === "h" || key === "H") toggleHidden();
      else handled = false;

      if (handled) {
        event.preventDefault();
        event.stopPropagation();
      }
    }

    function toggleHidden() {
      if (!manualHidden && autoHidden) {
        autoHidden = false;
        applyHidden();
        return;
      }
      setManual(!manualHidden);
    }

    function setManual(hidden) {
      manualHidden = hidden;
      if (hidden) autoHidden = false;
      else lastTargets.clear();
      try {
        sessionStorage.setItem(STORAGE_KEY, hidden ? "1" : "0");
      } catch (error) {}
      applyHidden();
    }

    function applyHidden() {
      var gone = manualHidden || autoHidden;
      if (gone) {
        closeTip();
        closeMenu(false);
      }
      document.documentElement.classList.toggle("is-hidden", gone);
      if (gone) bar.setAttribute("inert", "");
      else bar.removeAttribute("inert");
      peek.classList.toggle("is-shown", manualHidden);
      peek.tabIndex = manualHidden ? 0 : -1;
    }

    function readHidden() {
      try {
        return sessionStorage.getItem(STORAGE_KEY) === "1";
      } catch (error) {
        return false;
      }
    }

    function readHash() {
      var hash = location.hash.replace(/^#/, "");
      if (!hash) return "";
      try {
        return decodeURIComponent(hash);
      } catch (error) {
        return hash;
      }
    }

    applyHidden();
  })();
  </script>
</body>
</html>
